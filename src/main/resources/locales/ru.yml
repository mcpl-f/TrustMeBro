telegram:
  warning:
    header: "Игрок {interactor} взаимодействовал с блоками, связанными с:\\n"
    question: "Доверяете этому игроку?"
    materials-header: "Материалы (всего):"
    materials-more: "... и ещё {count} материалов"
  button:
    trust: "Доверять ✅"
    report: "Пожаловаться ❌"
    back: "⬅️ Назад"
    page-previous: "◀️"
    page-next: "▶️"
  command:
    mctrust:
      stub: "Команда TrustMeBro пока не реализована."
    myprofile:
      text: |-
        Профиль репутации 👤 {player}

        ⭐ Репутация

        ✅ Доверяют — {trusters}
        🚩 Пожаловались — {reporters}

        ⚖️ Решения

        ✅ Доверяет — {trusted}
        👁 Наблюдает — {watched}
        🚩 Жалоб подано — {reported}

        ⏳ Ожидают решения — {pending}
      title:
        reputation: "⭐ Репутация"
        ratings: "⚖️ Решения"

        trusters: "✅ Доверяют"
        reporters: "🚩 Пожаловались"

        trusted: "✅ Доверяет"
        watched: "👁 Наблюдает"
        reported: "🚩 Жалоб подано"

        pending: "⏳ Ожидают решения"
      button-with-count: "{title} ({count})"
      player-button: "👤 {player}"
      not-linked: "Telegram не привязан к Minecraft. Привяжите аккаунт или укажите ник: /rep Steve"
      unknown-player: "Игрок {player} не найден."
      bad-name: "Ник должен быть от 1 до 37 символов: латиница, цифры, подчёркивание или точка"
      failed: "Не удалось загрузить профиль."
    truststats:
      trusted-header: "Топ {n} самых доверенных:"
      trusted-by-count: "- {player}, доверяют {count}"
      trusted-by-names: "- {player}, доверяют {names}"
      suspicious-header: "Топ {n} подозрительных:"
      suspicious-line: "- {player}, взаимодействий {interactions} c владельцами {owners}"
      suspicious-regions: "^ в регионах {names}"
      suspicious-regions-more: "^ в регионах {names} и {others} других"
      reported-header: "Топ {n} по жалобам:"
      reported-by-count: "- {player}, пожаловались {count}"
      reported-by-names: "- {player}, пожаловались {names}"
      empty: "- (пусто)"
      failed: "Не удалось загрузить статистику."

minecraft:
  warning:
    header: "Игрок {interactor} взаимодействовал с блоками, связанными с вами"
    question: "Доверяете этому игроку?"
    count-line: "- {count} {label}"
    button:
      trust: "[Доверять]"
      report: "[Пожаловаться]"
      trust-hover: "Выполнить /ttrust {interactor}"
      report-hover: "Выполнить /treport {interactor}"
    hint: "Нажмите или пропишите команду /ttrust {interactor} или /treport {interactor}"

callback:
  bad-action: "Некорректное действие TrustMeBro"
  unknown-action: "Неизвестное действие TrustMeBro"
  link-required: "Сначала привяжите Telegram к Minecraft"
  already-reported: "{owner} уже пожаловался на {interactor}"
  already-trusted: "{owner} уже доверяет {interactor}"
  interaction-gone: "Взаимодействие больше не найдено"
  trusted: "{owner} теперь доверяет {interactor}"
  reported: "{owner} пожаловался на {interactor}"
  db-error: "Ошибка базы TrustMeBro"
  not-your-profile: "Эти кнопки принадлежат другому. Вызовите /rep сами."

feedback:

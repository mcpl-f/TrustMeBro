telegram:
  warning:
    header: "Player {interactor} interacted with blocks associated with:\n"
    question: "Do you trust this player?"
  button:
    trust: "Trust ✅"
    report: "Report ❌"
  command:
    mctrust:
      stub: "TrustMeBro command is not implemented yet."
    truststats:
      trusted-header: "Top {n} trusted players:"
      trusted-by-count: "- {player}, trusted by {count}"
      trusted-by-names: "- {player}, trusted by {names}"
      suspicious-header: "Top {n} suspicious players:"
      suspicious-line: "- {player}, interactions {interactions} with owners {owners}"
      suspicious-regions: "^ in regions {names}"
      suspicious-regions-more: "^ in regions {names} — and {others} more"
      reported-header: "Top {n} most reported:"
      reported-by-count: "- {player}, reported by {count}"
      reported-by-names: "- {player}, reported by {names}"
      empty: "- (none)"
      failed: "Failed to load trust stats."

minecraft:
  warning:
    header: "Player {interactor} interacted with blocks associated with you"
    question: "Do you trust this player?"
    count-line: "- {count} {label}"
    button:
      trust: "[Trust]"
      report: "[Report]"
      trust-hover: "Run /ttrust {interactor}"
      report-hover: "Run /treport {interactor}"
    hint: "Click or type /ttrust {interactor} or /treport {interactor}"

callback:
  bad-action: "Bad TrustMeBro action"
  unknown-action: "Unknown TrustMeBro action"
  link-required: "Link your Telegram account to Minecraft first"
  already-reported: "{owner} already reported {interactor}"
  already-trusted: "{owner} already trusts {interactor}"
  interaction-gone: "Interaction is gone"
  trusted: "{owner} now trusts {interactor}"
  reported: "{owner} reported {interactor}"
  db-error: "TrustMeBro DB error"

count:
  removed: "removed"
  placed: "placed"
  container-interactions: "container interactions"

command:
  new-trust-region:
    players-only: "Players only."
    bad-radius: "Radius must be a non-negative integer."
    unknown-world: "This world is unknown to CoreProtect; cannot create region."
    created: "Region #{id} \"{name}\" created at {world} {x}, {z} ± {radius}."
    failed: "Failed to create region."
  trust:
    players-only: "Players only."
    self: "You cannot trust yourself."
    unknown-player: "Player {player} not found."
  report:
    players-only: "Players only."
    self: "You cannot report yourself."
    unknown-player: "Player {player} not found."

region:
  at: "> {world} · x: {x}, z: {z} ± {radius}"
  at-named: |
    > region «{name}»
    at {world} x: {x}, z: {z}
      ± {radius}

world:
  overworld: "Overworld"
  nether: "Nether"
  end: "The End"
  custom: "{name}"
  unknown: "w{id}"

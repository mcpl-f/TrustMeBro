name: TrustMeBro
version: ${project.version}
description: ${project.description}
author: fulcanelly
api-version: 1.16
main: me.fulcanelly.trust.me.bro.TrustSysPlugin

depend:
  - CoreProtect
  - tg-bridge

commands:
  new_trust_region:
    description: Create a named trust region at your current position
    usage: /new_trust_region <radius> <name>
    permission: trusts.region.create
  ttrust:
    description: Trust a player so they no longer trigger warnings for your blocks
    usage: /ttrust <player>
    permission: trusts.command.trust
  treport:
    description: Report a player for suspicious interactions with your blocks
    usage: /treport <player>
    permission: trusts.command.report

permissions:
  trusts.region.create:
    description: Allows creating named trust regions
    default: op
  trusts.command.trust:
    description: Allows /ttrust
    default: true
  trusts.command.report:
    description: Allows /treport
    default: true

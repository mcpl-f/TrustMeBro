default-locale: ru

detection:

  split-by-regions:
    # when enabled: group interactions by nearby XZ regions (CoreProtect wid)
    # when disabled: one row per (interactor, owner) as before
    enabled: true
    merge-distance: 500

  exclude-banned-players: true

  debounce-time-sec: 60
  include-block-break: true
  include-block-place: true
  include-container-interaction: true

telegram:
  notify: true

  only-for-linked-players: true
  # means if owner is not linked, no notifications will be sent

  max-owners-per-notification: 10
  # owners listed in one Telegram warning: linked first, then recent lastPlayed

minecraft:
  notify-on-join: false


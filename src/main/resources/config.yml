default-locale: ru

detection:

  exclude-banned-players: true

  debounce-time-sec: 60
  include-block-break: true
  include-block-place: true
  include-container-interaction: true

telegram:
  notify: true

  only-for-linked-players: true
  # means if owner is not linked, no notifications will be sent

minecraft:
  notify-on-join: true

default-locale: ru

detection:

  split-by-regions:
    # when enabled: group interactions by nearby XZ regions (CoreProtect wid)
    # when disabled: one row per (interactor, owner) as before
    enabled: true
    merge-distance: 500

  exclude-banned-players: true

  debounce-time-sec: 60
  include-block-break: true
  include-block-place: true
  include-container-interaction: true

telegram:
  notify: true

  min-interactions:
    enabled: true

    # when enabled: notify only if place OR break OR chest count meets its minimum (SQL filter)
    # when disabled: notify for any pending interaction (after debounce)
    place-count: 20
    break-count: 10
    chest-inter-count: 2

  only-for-linked-players: true
  # when true: send only if at least one pending owner is TG-linked; list only linked owners

  max-owners-per-notification: 10
  # owners listed in one Telegram warning: linked first, then recent lastPlayed

  stats-top-size: 3
  # /truststats: how many players per Top section

minecraft:

  fetch-interactions-strategy: recent
  # avaliable options: recent | biggest
  # means: fetch interactors by created_at DESC or by sum of interactions DESC

  notify-on-join: false

